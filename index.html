<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAL LIFE</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000000;
      color: #ffffff;
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    .tela { position: fixed; inset: 0; display: none; }
    .tela.ativa { display: flex; }

    /* Tela 1: porta de entrada (Discord) */
    #gate { align-items: center; justify-content: center; }
    #btn-discord {
      position: absolute;
      top: 24px;
      right: 24px;
      height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 7px;
      background: #ffffff;
      color: #000000;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    #gate-status {
      padding: 22px;
      text-align: center;
      color: #cccccc;
      font-size: 14px;
      max-width: 420px;
    }

    /* Tela 2: LOGIN (mesmo visual do app) */
    #login { align-items: center; justify-content: center; }
    .form {
      width: 330px;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form h1 {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }
    .campo {
      width: 100%;
      height: 44px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.27);
      border-radius: 7px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }
    .campo::placeholder { color: rgba(255, 255, 255, 0.53); }
    .btn {
      width: 100%;
      height: 44px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-primario {
      margin-top: 14px;
      background: #ffffff;
      color: #000000;
      border: 0;
      font-weight: 700;
    }
    .btn-secundario {
      margin-top: 7px;
      background: rgba(0, 0, 0, 0.4);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.27);
    }
  </style>
</head>
<body>

  <!-- Tela 1: conectar com o Discord -->
  <section id="gate" class="tela ativa">
    <button id="btn-discord" type="button">Connect with Discord</button>
    <p id="gate-status"></p>
  </section>

  <!-- Tela 2: LOGIN (aparece só com o cargo) -->
  <section id="login" class="tela">
    <div class="form">
      <h1>LOGIN</h1>
      <input class="campo" type="email" placeholder="E-mail" autocomplete="username">
      <input class="campo" type="password" placeholder="Senha" autocomplete="current-password">
      <button class="btn btn-primario" type="button">CONECTAR</button>
      <button class="btn btn-secundario" type="button">CRIAR CONTA</button>
    </div>
  </section>

  <script>
    const gate = document.getElementById("gate");
    const login = document.getElementById("login");
    const statusEl = document.getElementById("gate-status");
    const botao = document.getElementById("btn-discord");

    // Código que liga este navegador ao app. Vem da URL (?code=...) quando o
    // app abre o site; se não vier, cria um novo e coloca na URL.
    function codigoAleatorio() {
      const bytes = new Uint8Array(24);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    }

    const params = new URLSearchParams(location.search);
    let code = params.get("code");
    if (!/^[A-Za-z0-9_-]{16,64}$/.test(code || "")) {
      code = codigoAleatorio();
      history.replaceState(null, "", "/?code=" + code);
    }

    function mostrarLogin() {
      gate.classList.remove("ativa");
      login.classList.add("ativa");
    }

    function setStatus(texto) {
      statusEl.textContent = texto;
    }

    botao.addEventListener("click", function () {
      window.location.href = "/api/discord/login?code=" + encodeURIComponent(code);
    });

    async function verificarCargo() {
      setStatus("Verificando sua conta do Discord...");
      try {
        const resposta = await fetch("/api/status?code=" + encodeURIComponent(code), {
          cache: "no-store"
        });
        if (!resposta.ok) throw new Error("HTTP " + resposta.status);

        const dados = await resposta.json();
        if (dados.hasRole === true) {
          mostrarLogin();
        } else if (dados.done === true) {
          setStatus("Sua conta não tem o cargo necessário na comunidade.");
        } else if (params.get("erro") === "1") {
          setStatus("Não foi possível conectar o Discord. Tente de novo.");
        } else {
          setStatus("Conecte sua conta do Discord e volte para o app.");
        }
      } catch (erro) {
        // Detalhe técnico fica no console (F12) para depuração.
        console.error("Falha ao verificar o cargo:", erro);
        setStatus("Verificação indisponível no momento. Tente novamente mais tarde.");
      }
    }

    verificarCargo();
  </script>

</body>
</html>
