<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAL LIFE</title>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #000000;
      color: #ffffff;
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .tela {
      position: fixed;
      inset: 0;
      display: none;
    }

    .tela.ativa { display: flex; }

    /* Tela 1: porta de entrada (Discord) */
    #gate {
      align-items: center;
      justify-content: center;
    }

    #btn-discord {
      position: absolute;
      top: 24px;
      right: 24px;
      height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 7px;
      background: #ffffff;
      color: #000000;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    #gate-status {
      padding: 22px;
      text-align: center;
      color: #cccccc;
      font-size: 14px;
    }

    /* Tela 2: LOGIN (mesmo visual do app) */
    #login {
      align-items: center;
      justify-content: center;
    }

    .form {
      width: 330px;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form h1 {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }

    .campo {
      width: 100%;
      height: 44px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.27);
      border-radius: 7px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .campo::placeholder { color: rgba(255, 255, 255, 0.53); }

    .btn {
      width: 100%;
      height: 44px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-primario {
      margin-top: 14px;
      background: #ffffff;
      color: #000000;
      border: 0;
      font-weight: 700;
    }

    .btn-secundario {
      margin-top: 7px;
      background: rgba(0, 0, 0, 0.4);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.27);
    }
  </style>
</head>
<body>

  <!-- Tela 1: conectar com o Discord -->
  <section id="gate" class="tela ativa">
    <button id="btn-discord" type="button">Connect with Discord</button>
    <p id="gate-status"></p>
  </section>

  <!-- Tela 2: LOGIN (aparece só com o cargo) -->
  <section id="login" class="tela">
    <div class="form">
      <h1>LOGIN</h1>
      <input class="campo" type="email" placeholder="E-mail" autocomplete="username">
      <input class="campo" type="password" placeholder="Senha" autocomplete="current-password">
      <button class="btn btn-primario" type="button">CONECTAR</button>
      <button class="btn btn-secundario" type="button">CRIAR CONTA</button>
    </div>
  </section>

  <script>
    const SITE_URL = "https://discord-kallide2.vercel.app/";
    const ROLE_ID = "1570611328937103390";
    // Endpoint do site que responde {"hasRole": true|false}. Ajuste para o seu backend.
    const STATUS_URL = "https://discord-kallide2.vercel.app/api/status";

    const gate = document.getElementById("gate");
    const login = document.getElementById("login");
    const statusEl = document.getElementById("gate-status");
    const botao = document.getElementById("btn-discord");
    let verificando = false;

    function mostrarLogin() {
      gate.classList.remove("ativa");
      login.classList.add("ativa");
    }

    function setStatus(texto) {
      statusEl.textContent = texto;
    }

    botao.addEventListener("click", function () {
      window.open(SITE_URL, "_blank", "noopener");
    });

    async function verificarCargo() {
      if (verificando || login.classList.contains("ativa")) return;
      verificando = true;
      setStatus("Verificando sua conta do Discord...");

      try {
        const resposta = await fetch(STATUS_URL + "?role=" + ROLE_ID, {
          credentials: "include",
          cache: "no-store"
        });
        if (!resposta.ok) throw new Error("HTTP " + resposta.status);

        const dados = await resposta.json();
        if (dados.hasRole === true) {
          mostrarLogin();
        } else {
          setStatus("Conecte sua conta do Discord e volte para esta página.");
        }
      } catch (erro) {
        // Detalhe técnico fica no console (F12) para depuração.
        console.error("Falha ao verificar o cargo:", erro);
        setStatus("Verificação indisponível no momento. Tente novamente mais tarde.");
      } finally {
        verificando = false;
      }
    }

    // Verifica ao abrir e ao voltar para a página (depois de conectar no site).
    window.addEventListener("focus", verificarCargo);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) verificarCargo();
    });
    verificarCargo();
  </script>

</body>
</html>
