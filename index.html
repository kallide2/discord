<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect with Discord</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1e1f22;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background-color: #5865F2;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.35);
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .discord-btn:hover {
      background-color: #4752C4;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(88, 101, 242, 0.5);
    }

    .discord-btn:active {
      transform: translateY(0);
    }

    .discord-btn.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .discord-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <a href="#" id="discord-btn" class="discord-btn">
    <svg class="discord-icon" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
      <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
    </svg>
    <span>Connect with Discord</span>
  </a>

  <script>
    var BACKEND_URL = "";

    function novaSessao() {
      var bytes = new Uint8Array(24);
      window.crypto.getRandomValues(bytes);
      return Array.prototype.map.call(bytes, function (b) {
        return ("0" + b.toString(16)).slice(-2);
      }).join("");
    }

    var params = new URLSearchParams(window.location.search);
    var sessao = params.get("s");
    if (!/^[A-Za-z0-9_-]{16,64}$/.test(sessao || "")) {
      sessao = novaSessao();
    }

    var botao = document.getElementById("discord-btn");
    botao.href = BACKEND_URL + "/discord/login?s=" + encodeURIComponent(sessao);
    botao.addEventListener("click", function () {
      botao.classList.add("loading");
      botao.querySelector("span").textContent = "Abrindo o Discord...";
    });
  </script>

</body>
</html>
